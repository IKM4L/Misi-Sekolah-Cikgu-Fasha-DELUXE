function bank(){return activeBank()}function pickQuestion(){let q=bank()[Math.floor(Math.random()*bank().length)],idx=[0,1,2].sort(()=>Math.random()-.5);return{q:q[0],opts:idx.map(i=>q[1][i]),ans:idx.indexOf(q[2])}};
const $=s=>document.querySelector(s);function persist(){localStorage.setItem(saveKey,JSON.stringify({name:profile.name,year:profile.year,gender:profile.gender,done:[...completed],xp,coins}))}function panel(html){modal=true;paused=true;$('#overlay').classList.remove('hidden');$('#panel').innerHTML=html}function close(){modal=false;paused=false;$('#overlay').classList.add('hidden')}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';toastUntil=performance.now()+2300}function beep(freq=600){if(!sound)return;try{let ac=window.__ac||(window.__ac=new(window.AudioContext||window.webkitAudioContext)()),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.13)}catch{}}

function zoneChallenge(p){let q=pickQuestion();panel(`<div class="big">${p.icon}</div><span class="tag">🌟 Dunia ${p.area}</span><h2>${p.name}</h2><p>${zones.find(z=>z.name===p.area)?.description||''}</p><p><b>${escapeHtml(q.q)}</b></p>${q.opts.map((o,i)=>`<button class="option" data-zoneans="${i}">${'ABC'[i]}. ${escapeHtml(o)}</button>`).join('')}<p class="note">❤️ Nyawa: ${lives}/3 · 📚 Topik: ${escapeHtml(topic)}</p><button class="btn secondary" id="back">Kembali</button>`);$('#back').onclick=close;document.querySelectorAll('[data-zoneans]').forEach(b=>b.onclick=()=>{if(+b.dataset.zoneans===q.ans){completed.add(p.id);xp+=150;coins+=10;beep(860);persist();panel(`<div class="big">🏆</div><h2>Hebat!</h2><p>Kamu menamatkan cabaran ${p.area}!</p><p class="tag">+150 XP · +10 syiling</p><button class="btn" id="back">Teruskan</button>`);$('#back').onclick=close}else{lives--;beep(210);if(lives<=0){lives=3;panel(`<div class="big">💗</div><h2>Cuba Lagi!</h2><p>Nyawa habis. Berehat dan cuba lagi, ya!</p><button class="btn" id="back">Sambung</button>`);$('#back').onclick=close}else{b.disabled=true;b.style.background='#ffdddd';toast('❌ Cuba jawapan lain! ❤️ '+lives)}}})}
function leaderboard(){let data=[];try{data=JSON.parse(localStorage.getItem('fasha_leaderboard_v3')||'[]')}catch{};data.push({name:profile.name,year:profile.year,xp,coins,date:new Date().toLocaleDateString('ms-MY')});data.sort((a,b)=>b.xp-a.xp);data=data.slice(0,30);localStorage.setItem('fasha_leaderboard_v3',JSON.stringify(data));panel(`<div class="big">🏆</div><h2>Papan Markah Setempat</h2><p class="note">Keputusan hanya disimpan dalam pelayar/peranti ini. Ia bukan papan markah kelas dalam talian.</p><table class="leader"><thead><tr><th>#</th><th>Nama</th><th>Tahun</th><th>XP</th></tr></thead><tbody>${data.slice(0,12).map((r,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(r.name)}</td><td>${r.year}</td><td>${r.xp}</td></tr>`).join('')}</tbody></table><button class="btn" id="csv">⬇ Eksport CSV</button><button class="btn secondary" id="back">Kembali</button>`);$('#back').onclick=close;$('#csv').onclick=()=>{let csv='Nama,Tahun,XP,Syiling,Tarikh\n'+data.map(r=>[r.name,r.year,r.xp,r.coins,r.date].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');let url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='papan_markah_cikgu_fasha.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}}
function openRunner(){if(runnerActive)return;runnerActive=true;let stage=0;runnerState={x:52,y:154,vy:0,score:0,obstacles:[],books:[],time:0,life:3,stage:0,playing:false};panel(`<div class="big">🏃📚</div><h2>Larian Ke Sekolah</h2><p>Lompat halangan dan kutip buku! Enam tahap berlatar dunia sekolah. Tekan <b>Space / ↑</b> atau sentuh butang <b>LOMPAT</b>.</p><div class="runner-hud"><span id="rscore">📚 0 buku</span><span id="rlife">❤️❤️❤️</span><span id="rstage">Tahap 1/6</span></div><canvas id="runner" class="runner" width="480" height="210"></canvas><button class="btn" id="jump">⬆ LOMPAT</button><button class="btn secondary" id="exitrun">Tutup Larian</button>`);let rc=$('#runner'),rctx=rc.getContext('2d');runnerState.playing=true;const jump=()=>{if(runnerState&&runnerState.y>=154)runnerState.vy=-10};$('#jump').onpointerdown=jump;rc.onpointerdown=jump;const onKey=e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}};addEventListener('keydown',onKey);const stop=()=>{runnerActive=false;runnerState.playing=false;removeEventListener('keydown',onKey);close()};$('#exitrun').onclick=stop;function loop(){let s=runnerState;if(!s.playing||!document.querySelector('#runner')){removeEventListener('keydown',onKey);runnerActive=false;return}let w=480,h=210;s.time++;let speed=3.5+s.stage*.65;s.vy+=.5;s.y=Math.min(154,s.y+s.vy);if(s.y>=154)s.vy=0;if(s.time%90===0)s.obstacles.push({x:490});if(s.time%62===0)s.books.push({x:490,y:112+Math.sin(s.time)*14});s.obstacles.forEach(o=>o.x-=speed);s.books.forEach(b=>b.x-=speed);for(let o of s.obstacles){if(o.x<79&&o.x+23>47&&s.y>124){s.life--;o.x=-100;beep(180)}}for(let b of s.books){if(b.x<85&&b.x>38&&Math.abs(s.y-b.y)<44){s.score++;xp+=10;coins++;b.x=-100;beep(740)}}s.obstacles=s.obstacles.filter(o=>o.x>-30);s.books=s.books.filter(b=>b.x>-30);s.stage=Math.min(5,Math.floor(s.time/560));rctx.fillStyle=['#a5d9f5','#9bd7bb','#d9c9f0','#f6d8b4','#f4d0dd','#a6c3f4'][s.stage];rctx.fillRect(0,0,w,h);rctx.fillStyle='#7fbe85';rctx.fillRect(0,177,w,33);for(let i=0;i<8;i++){rctx.fillStyle='#fff7d7';rctx.fillRect(((i*90-s.time*speed)%570+570)%570,186,45,4)}rctx.font='bold 15px system-ui';rctx.fillStyle='#27324b';rctx.fillText(zones[s.stage].name,18,25);rctx.font='28px system-ui';rctx.fillText('🎒',s.x-6,s.y-8);rctx.font='25px system-ui';s.obstacles.forEach(o=>rctx.fillText('🚧',o.x,171));s.books.forEach(b=>rctx.fillText('📚',b.x,b.y));$('#rscore').textContent='📚 '+s.score+' buku';$('#rlife').textContent='❤️'.repeat(Math.max(0,s.life));$('#rstage').textContent='Tahap '+(s.stage+1)+'/6';if(s.life<=0||s.time>=3360){s.playing=false;runnerActive=false;removeEventListener('keydown',onKey);persist();let victory=s.life>0;panel(`<div class="big">${victory?'🏆':'💗'}</div><h2>${victory?'Tahniah, larian tamat!':'Larian tamat!'}</h2><p>Kamu berjaya mengutip <b>${s.score} buah buku</b> dan memperoleh ${s.score*10} XP.</p><button class="btn" id="rback">Kembali ke sekolah</button>`);$('#rback').onclick=close;return}requestAnimationFrame(loop)}requestAnimationFrame(loop)}
